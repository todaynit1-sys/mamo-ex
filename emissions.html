const clamp=x=>Math.min(1,Math.max(0,x)),ease=x=>1-(1-clamp(x))**3;
function rect(x,y,w,h,fill,r=10,stroke){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function poly(points,fill){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=fill;c.fill()}
function line(x,y,X,Y,color=A,w=3){c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.strokeStyle=color;c.lineWidth=w;c.lineCap='round';c.stroke()}
function circle(x,y,r,color){c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=color;c.fill()}
function ellipse(x,y,rx,ry,color){c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fillStyle=color;c.fill()}

function base(i,u){let g=c.createLinearGradient(0,0,1200,720);g.addColorStop(0,'#102638');g.addColorStop(1,'#07121d');c.fillStyle=g;c.fillRect(0,0,1200,720);ellipse(410,660,440,42,'#030b1355');poly([[30,525],[230,390],[828,390],[893,550],[686,682],[32,635]],'#183342');poly([[32,635],[686,682],[686,698],[32,650]],'#0c2332');poly([[686,682],[893,550],[893,566],[686,698]],'#102837');for(let n=0;n<6;n++){const x=50+n*139;solid(x,271+(n%2)*22,56,115,'#183448','#122b3a','#274453')}tree(88,540,.8);tree(755,476,.75);tree(68,645,.65);if(!mobile){text('수도권대기환경청  /  '+D.department,36,41,17,A);text(D.title,36,93,35);}text('20 SECOND FIELD STORY',1164,40,12,'#9bb6c8','right');
 rect(906,158,258,450,'#102738',16,'#365164');text('0'+(i+1)+' / 05',932,196,16,A);text(D.names[i],932,244,27);line(932,268,1138,268,'#365164',1);let lines=wrap(D.captions[i],185,20);lines.forEach((s,n)=>text(s,932,308+n*34,20,'#dce9ed'));for(let j=0;j<5;j++)rect(932+j*42,555,32,4,j<=i?A:'#365164',2);text('업무 이해를 위한 개념도',1164,680,13,'#a4bbc8','right');
}
