<style>
/* Layout: one 16:9 stage (canvas camera travels stack → truck → lab → report), captions overlaid, 5-step rail below */
:root{
  --ink:#0c1822; --panel:#132736; --line:#27425a; --text:#e5edf1; --muted:#8ea6b5; --accent:#f0a24e;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 40px;display:grid;gap:18px}
header{display:grid;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--accent)}
h1{margin:0;font-size:clamp(24px,3.6vw,38px);line-height:1.2;font-weight:700;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:64ch}
.stage{position:relative;margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0e2233}
canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%}
.hud{position:absolute;top:12px;font-family:var(--mono);font-size:12px;color:var(--text);background:rgba(12,24,34,.72);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.hud.tl{left:12px}.hud.tr{right:12px}
.cap{position:absolute;left:0;right:0;bottom:0;padding:48px 22px 18px;background:linear-gradient(to top,rgba(10,20,28,.92),rgba(10,20,28,0));display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.cap b{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--ink);background:var(--accent);padding:2px 10px;border-radius:6px;white-space:nowrap}
.cap p{margin:0;font-size:clamp(14px,1.7vw,19px);font-weight:500;min-width:0;flex:1 1 280px}
.cap.in b,.cap.in p{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.cap.in p{animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.controls{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.play{font:600 14px var(--sans);color:var(--ink);background:var(--accent);border:0;border-radius:10px;padding:0 18px;min-height:52px;cursor:pointer;min-width:112px}
.play:focus-visible,.step:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;flex:1 1 480px;min-width:0}
.step{width:100%;height:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;color:var(--muted);cursor:pointer;font:inherit;display:grid;gap:2px;position:relative;overflow:hidden}
.step .n{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.step .t{font-weight:700;font-size:15px}
.step .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
.step[aria-current="step"]{color:var(--text);border-color:var(--accent)}
.note{margin:0;font-size:12.5px;color:var(--muted)}
@media (max-width:640px){
  .cap{position:static;background:var(--panel);padding:12px 14px;border-top:1px solid var(--line)}
  .hud{font-size:10.5px;top:8px;padding:3px 8px}.hud.tl{left:8px}.hud.tr{right:8px}
  .steps{gap:5px}.step{padding:8px 6px 10px;text-align:center}.step .n{display:none}.step .t{font-size:14px}
  .play{width:100%}
}
@media (prefers-reduced-motion:reduce){.cap.in b,.cap.in p{animation:none}}
</style>

<main class="wrap">
  <header>
    <span class="eyebrow">굴뚝 배출가스 측정 · 모션 그래픽</span>
    <h1>배출구에서 채취하고, 실험실에서 분석하기</h1>
    <p class="lede">조사분석과의 굴뚝 측정: 시료 채취부터 시험분석과 결과 검토까지 30초로 살펴봅니다.</p>
  </header>

  <figure class="stage">
    <canvas id="cv" aria-label="작업자가 굴뚝 측정구에 프로브를 꽂아 시료를 채취하고, 차량으로 실험실에 옮겨 저울, 가스크로마토그래프, 흡광광도계로 분석한 뒤 결과표에 적합 판정을 받는 애니메이션"></canvas>
    <div class="hud tl">대기오염공정시험기준 · 굴뚝 배출가스</div>
    <div class="hud tr" id="clock">00:00 / 00:30</div>
    <div class="cap" id="cap" aria-live="polite"><b id="capStep">1 준비</b><p id="capText"></p></div>
  </figure>

  <div class="controls">
    <button class="play" id="play" type="button">일시정지</button><button class="play voice" id="voice" type="button" aria-pressed="false">음성 해설 듣기</button>
    <ol class="steps" id="steps"></ol>
  </div>
  <p class="note">화면의 측정값과 배출허용기준은 설명용 예시입니다. 실제 기준은 시설 종류와 설치 시기에 따라 다릅니다.</p>
</main>

  ctx.fillStyle='#f3f0d8';ctx.fillRect(x-11,F-52,22,4);ctx.fillRect(x-11,F-42,22,3);
  ctx.strokeStyle='#e07f28';ctx.lineWidth=6;
  if(w.pose==='climb'){line(x-8,F-60,x-10,F-86+o);line(x+8,F-60,x+10,F-86-o);}
  else if(w.pose==='probe'){line(x-8,F-58,x-24,F-38);line(x+8,F-58,x-14,F-36);}
  else if(w.pose==='walk'){const s=Math.sin(now*10)*6;line(x-8,F-58,x-10+s,F-36);line(x+8,F-58,x+10-s,F-36);}
  else{line(x-8,F-58,x-12,F-36);line(x+8,F-58,x+12,F-36);}
  ctx.fillStyle='#e8c4a0';ctx.beginPath();ctx.arc(x,F-73,8,0,7);ctx.fill();
  ctx.fillStyle='#f5c542';ctx.beginPath();ctx.arc(x,F-76,10,Math.PI,0);ctx.fill();ctx.fillRect(x-12,F-77,24,3);
  ctx.lineCap='butt';
}
function drawTruck(t,now){
  const x=truckAt(t),y=G;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x+80,y+2,90,7,0,0,7);ctx.fill();
  ctx.fillStyle='#dfe8ec';rr(x,y-66,112,54,6);ctx.fill();
  ctx.fillStyle='#cfdadf';rr(x+112,y-50,48,38,[4,14,4,4]);ctx.fill();
  ctx.fillStyle='#264a5e';ctx.fillRect(x+124,y-44,28,14);
  ctx.fillStyle='#f0a24e';ctx.fillRect(x,y-24,160,6);
  txt('측정팀',x+56,y-34,`700 14px ${FONT}`,'#1b3a4c','center');
  for(const wx of[x+32,x+132]){ctx.fillStyle='#0c171e';ctx.beginPath();ctx.arc(wx,y-10,13,0,7);ctx.fill();ctx.fillStyle='#8ea6b5';ctx.beginPath();ctx.arc(wx,y-10,5,0,7);ctx.fill();}
  if(t>=13.8&&t<18.2){ctx.fillStyle='#e9eef0';rr(x+28,y-100,60,34,5);ctx.fill();ctx.fillStyle='#5aa9e6';ctx.fillRect(x+28,y-88,60,6);
    txt('시료 4℃',x+58,y-73,`700 11px ${FONT}`,'#1b3a4c','center');}
}
function drawPacking(t){
  if(t<12.3||t>=13.8)return;
  const k=eio((t-12.3)/1.5),tx=truckAt(t)+58,ty=G-84;
  const items=[[489,435,'f'],[558,448,'b'],[716,414,'g']];
  items.forEach(([sx,sy,kind],i)=>{const u=clamp(k*1.15-i*.07),x=lerp(sx,tx,u),y=lerp(sy,ty,u)-Math.sin(u*Math.PI)*120;
    if(kind==='f'){ctx.fillStyle='#8f877a';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();}
    else if(kind==='b'){ctx.fillStyle='#cfe8f0';ctx.fillRect(x-6,y-12,12,24);}
    else{ctx.fillStyle='#e6d6aa';ctx.beginPath();ctx.ellipse(x,y,20,14,0,0,7);ctx.fill();}});
}
// ---------- lab ----------
const PEAKS=[{r:2.9,h:.5,n:'벤젠',hot:1},{r:5.1,h:.82,n:'톨루엔'},{r:7.2,h:.3,n:'에틸벤젠'},{r:7.9,h:.46,n:'자일렌'}];
function signal(rt){let s=.012*(Math.sin(rt*13.1)+.6*Math.sin(rt*31.7+1));for(const p of PEAKS)s+=p.h*Math.exp(-((rt-p.r)**2)/(2*.08*.08));return s}
function monitor(x,y,w,h){ctx.fillStyle='#3a4d57';rr(x-6,y-6,w+12,h+12,8);ctx.fill();ctx.fillStyle='#0f2029';rr(x,y,w,h,4);ctx.fill();}
function drawLab(t,now){
  // building shell + interior
  ctx.fillStyle='#2a4658';ctx.fillRect(820,280,780,G-280);
  ctx.fillStyle='#d3dde0';ctx.fillRect(838,300,762,G-300);
  ctx.fillStyle='#c6d2d6';for(let y=320;y<600;y+=40)ctx.fillRect(838,y,762,1);
  ctx.fillStyle='#22404f';ctx.fillRect(812,272,796,16);
  txt('대기 분석 실험실',1210,262,`700 20px ${FONT}`,'#e5edf1','center');
  for(const lx of[960,1210,1450]){ctx.fillStyle='#f4f7f2';ctx.fillRect(lx-50,300,100,6);}
  // bench
  ctx.fillStyle='#5d707a';ctx.fillRect(850,610,740,12);ctx.fillStyle='#9fb0b8';ctx.fillRect(856,622,728,G-622);
  ctx.strokeStyle='#8b9ca4';ctx.lineWidth=2;for(let x=856;x<1584;x+=104)ctx.strokeRect(x+4,630,96,G-640);
  const L=(s,x)=>txt(s,x,340,`700 15px ${FONT}`,'#1c3444');
  L('① 먼지 · 여지 칭량',870);L('② VOCs · 가스크로마토그래프',1100);L('③ SOx·NOx · 흡광광도법',1350);

  // ① desiccator + balance
  ctx.fillStyle='rgba(180,210,220,.6)';ctx.beginPath();ctx.ellipse(915,610,34,6,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(882,610);ctx.bezierCurveTo(882,560,948,560,948,610);ctx.fill();ctx.strokeStyle='#7a98a6';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#7a98a6';ctx.fillRect(911,558,8,6);
  ctx.fillStyle='#e9eef0';rr(962,572,104,38,5);ctx.fill();
  ctx.fillStyle='rgba(190,220,230,.45)';ctx.fillRect(972,500,84,72);ctx.strokeStyle='#8fb0bd';ctx.strokeRect(972,500,84,72);
  ctx.fillStyle='#b9c4c9';ctx.fillRect(994,560,40,5);
  const fm=eio(clamp((t-18.6)/1)),fx=lerp(915,1014,fm),fy=lerp(596,554,fm)-Math.sin(fm*Math.PI)*40;
  if(t>=18)ctx.fillStyle='#8f877a',ctx.beginPath(),ctx.ellipse(fx,fy,14,4,0,0,7),ctx.fill();
  const wv=t<19.6?0:t<20.6?.35862+Math.sin(now*40)*.0004*(20.6-t):.35862;
  ctx.fillStyle='#0f2029';rr(972,580,84,20,3);ctx.fill();
  txt(wv.toFixed(5)+' g',1050,595,`600 13px ${MONO}`,'#7ee0a0','right');
  monitor(870,362,200,118);
  const rowsA=[['채취 전','0.35214 g'],['채취 후',t>=20.6?'0.35862 g':'—'],['먼지량',t>=21.1?'6.48 mg':'—'],['농도',t>=21.6?'12.8 mg/Sm³':'—']];
  rowsA.forEach((r,i)=>{const hot=i===3&&t>=21.6;txt(r[0],882,388+i*25,`500 13px ${FONT}`,'#8ea6b5');txt(r[1],1058,388+i*25,`600 ${hot?15:13}px ${MONO}`,hot?'#f0a24e':'#e5edf1','right');});

  // ② GC
  ctx.fillStyle='#e9eef0';rr(1110,500,190,110,6);ctx.fill();
  ctx.fillStyle='#c4d0d5';rr(1122,512,110,86,4);ctx.fill();ctx.strokeStyle='#9fb0b8';ctx.strokeRect(1122,512,110,86);
  ctx.strokeStyle='#8f9aa0';ctx.lineWidth=1.5;ctx.beginPath();for(let a=0;a<18;a+=.3){const r=6+a*1.4;ctx.lineTo(1177+Math.cos(a)*r,555+Math.sin(a)*r*.7);}ctx.stroke();
  ctx.fillStyle='#0f2029';ctx.fillRect(1244,516,46,14);txt(t>=19?'RUN':'READY',1286,527,`600 10px ${MONO}`,'#7ee0a0','right');
  ctx.fillStyle='rgba(230,214,170,.85)';ctx.beginPath();ctx.ellipse(1276,574,18,13,0,0,7);ctx.fill();
  monitor(1100,362,210,118);
  const pr=clamp((t-19)/3.4),cx0=1112,cx1=1298,cy0=376,cy1=462,cw=cx1-cx0,chh=cy1-cy0;
  ctx.strokeStyle='#27425a';ctx.lineWidth=1;line(cx0,cy1,cx1,cy1);
  if(pr>0){const end=10*pr,N=Math.round(260*pr)+2;
    ctx.beginPath();for(let i=0;i<=N;i++){const rt=end*i/N,x=cx0+cw*rt/10,y=cy1-2-signal(rt)*(chh-8);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.strokeStyle='#5cc8e8';ctx.lineWidth=1.8;ctx.stroke();
    for(const p of PEAKS){if(end<p.r+.2)continue;const x=cx0+cw*p.r/10,y=cy1-2-signal(p.r)*(chh-8);
      txt(p.n,x,Math.max(cy0+2,y-5),`600 10px ${FONT}`,p.hot?'#ff8a7e':'#c9d6dd','center');}}
  else txt('시료 주입 대기',1205,425,`500 13px ${FONT}`,'#8ea6b5','center');
  if(t>=22.6)txt('벤젠 2.1 ppm',1298,476,`600 12px ${MONO}`,'#f0a24e','right');

  // ③ spectrophotometer
  ctx.fillStyle='#e9eef0';rr(1356,548,180,62,6);ctx.fill();
  ctx.fillStyle='#b9c4c9';ctx.fillRect(1380,540,34,10);
  const cu=eio(clamp((t-18.8)/1.2));ctx.fillStyle='rgba(214,190,120,.8)';ctx.fillRect(1391,lerp(470,532,cu),12,24);
  ctx.fillStyle='#0f2029';ctx.fillRect(1440,560,84,16);txt(t>=21.4?'A 0.412':'A —',1520,572,`600 11px ${MONO}`,'#7ee0a0','right');
  for(let i=0;i<3;i++){ctx.strokeStyle='#8fb0bd';ctx.lineWidth=1.2;ctx.strokeRect(1360+i*16,580,10,28);ctx.fillStyle='rgba(200,232,240,.8)';ctx.fillRect(1360+i*16,592,10,16);}
  monitor(1340,362,210,118);
  const px0=1360,px1=1536,py0=372,py1=458,conc=c=>px0+(px1-px0)*c/120,abs=a=>py1-(py1-py0)*a/.9;
  ctx.strokeStyle='#27425a';ctx.lineWidth=1;line(px0,py1,px1,py1);line(px0,py0,px0,py1);
  txt('농도',px1,py1+13,`500 9px ${FONT}`,'#8ea6b5','right');txt('흡광도',px0+4,py0+6,`500 9px ${FONT}`,'#8ea6b5');
  const STD=[0,25,50,100],A=c=>.02+.00817*c;
  STD.forEach((c,i)=>{if(t<19.5+i*.3)return;ctx.fillStyle='#c9d6dd';ctx.beginPath();ctx.arc(conc(c),abs(A(c)),3,0,7);ctx.fill();});
  if(t>=20.8){const k=clamp((t-20.8)/.5);ctx.strokeStyle='#5cc8e8';ctx.lineWidth=1.5;line(conc(0),abs(A(0)),conc(lerp(0,110,k)),abs(A(lerp(0,110,k))));}
  if(t>=21.4){ctx.setLineDash([3,3]);ctx.strokeStyle='#f0a24e';ctx.lineWidth=1;line(px0,abs(.412),conc(48),abs(.412));line(conc(48),abs(.412),conc(48),py1);ctx.setLineDash([]);
    ctx.fillStyle='#f0a24e';ctx.beginPath();ctx.arc(conc(48),abs(.412),4.5,0,7);ctx.fill();}
  if(t>=21.9)txt('SOx 48 ppm',1536,476,`600 12px ${MONO}`,'#f0a24e','right');
  if(t>=22.5)txt('NOx 62 ppm',1440,476,`600 12px ${MONO}`,'#f0a24e','right');
}
// ---------- report (screen space, world units) ----------
const REP=[['먼지','12.8 mg/Sm³','30 mg/Sm³'],['황산화물(SOx)','48 ppm','200 ppm'],['질소산화물(NOx)','62 ppm','100 ppm'],['벤젠','2.1 ppm','6 ppm']];
function drawReport(t,now){
  if(t<24.2)return;
  const k=eout(clamp((t-24.2)/.9));
  ctx.fillStyle=`rgba(8,16,22,${.55*k})`;ctx.fillRect(0,0,W,H);
  const X=400,Y=lerp(140,64,k),PW=800,PH=772;
  ctx.globalAlpha=k;
  ctx.fillStyle='rgba(0,0,0,.35)';rr(X+8,Y+12,PW,PH,6);ctx.fill();
  ctx.fillStyle='#f3f5f1';rr(X,Y,PW,PH,6);ctx.fill();
  txt('대기오염물질 측정 결과 성적서',X+50,Y+70,`700 34px ${FONT}`,'#14242e');
  txt('측정 대상  A 사업장 1번 배출구     측정 방법  대기오염공정시험기준',X+50,Y+108,`500 17px ${FONT}`,'#4f6371');
  ctx.fillStyle='#14242e';ctx.fillRect(X+50,Y+128,PW-100,3);
  const cond=[['유속','12.4 m/s'],['배출가스 온도','142 ℃'],['수분량','8.2 %'],['흡인량','506 L']];
  cond.forEach((c,i)=>{const cx=X+50+i*175;txt(c[0],cx,Y+166,`500 15px ${FONT}`,'#6a7c88');txt(c[1],cx,Y+194,`600 20px ${MONO}`,'#14242e');});
  const hy=Y+250;ctx.fillStyle='#e2e8e6';ctx.fillRect(X+50,hy-30,PW-100,44);
  const C=[X+66,X+380,X+560,X+734];
  txt('항목',C[0],hy,`700 17px ${FONT}`,'#14242e');txt('측정값',C[1],hy,`700 17px ${FONT}`,'#14242e','right');txt('배출허용기준',C[2],hy,`700 17px ${FONT}`,'#14242e','right');txt('판정',C[3],hy,`700 17px ${FONT}`,'#14242e','right');
  REP.forEach((r,i)=>{const a=clamp((t-25-i*.4)/.4);if(a<=0)return;ctx.globalAlpha=k*a;const y=hy+62+i*62;
    txt(r[0],C[0],y,`600 21px ${FONT}`,'#14242e');txt(r[1],C[1],y,`600 21px ${MONO}`,'#14242e','right');txt(r[2],C[2],y,`500 19px ${MONO}`,'#6a7c88','right');
    txt('적합',C[3],y,`700 20px ${FONT}`,'#2f8a55','right');
    ctx.fillStyle='#d5ddda';ctx.fillRect(X+50,y+22,PW-100,1);ctx.globalAlpha=k;});
  txt('측정값은 표준상태(0 ℃, 1기압, 건조가스) 환산 기준입니다.',X+50,Y+PH-60,`500 15px ${FONT}`,'#6a7c88');
  if(t>=27){const s=clamp((t-27)/.35),sc=lerp(1.8,1,eout(s));ctx.save();ctx.translate(X+PW-150,Y+PH-150);ctx.rotate(-.22);ctx.scale(sc,sc);ctx.globalAlpha=k*s*.92;
    ctx.strokeStyle='#d0463c';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,70,0,7);ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,58,0,7);ctx.stroke();
    txt('적합',0,14,`700 40px ${FONT}`,'#d0463c','center');ctx.restore();}
  ctx.globalAlpha=1;
}

// ---------- camera ----------
const sceneAt=t=>{for(let i=SCN.length-1;i>=0;i--)if(t>=SCN[i].t)return i;return 0};
function camAt(t){
  const i=sceneAt(t),s=SCN[i],p=SCN[(i+SCN.length-1)%SCN.length],pc=p.cam(i?s.t:LOOP),c=s.cam(t),k=eio(clamp((t-s.t)/1.4));
  const z=lerp(pc.z,c.z,k)*(1+.02*clamp((t-s.t-1.4)/4.6)),hw=W/2/z,hh=H/2/z;
  return{z,x:clamp(lerp(pc.x,c.x,k),hw,W-hw),y:clamp(lerp(pc.y,c.y,k),hh,H-hh)};
}

// ---------- UI ----------
const stepsEl=document.getElementById('steps'),bars=[],btns=[];
SCN.forEach((s,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.className='step';b.id='step'+i;
  b.innerHTML=`<span class="n">${i+1}단계 · ${String(s.t).padStart(2,'0')}초</span><span class="t">${s.name}</span><span class="bar"></span>`;
  b.onclick=()=>{T=s.t+.001;};li.appendChild(b);stepsEl.appendChild(li);bars.push(b.querySelector('.bar'));btns.push(b);});
const capEl=document.getElementById('cap'),capStep=document.getElementById('capStep'),capText=document.getElementById('capText'),clockEl=document.getElementById('clock'),playEl=document.getElementById('play');
let cur=-1;
function setCaption(i){if(i===cur)return;cur=i;if(playing)V.scene(i);capStep.textContent=`${i+1} ${SCN[i].name}`;capText.textContent=SCN[i].text;
  capEl.classList.remove('in');void capEl.offsetWidth;capEl.classList.add('in');btns.forEach((b,k)=>k===i?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current'));}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let T=reduce?2:0,playing=!reduce,last=performance.now()/1000;
playEl.textContent=playing?'일시정지':'재생';
const V=window.MAMO_VOICE.init({button:document.getElementById('voice'),clips:window.MAMO_CLIPS||[],id:'stack',onEnable:()=>{T=SCN[sceneAt(T)].t+.001;if(!playing){playing=true;playEl.textContent='일시정지'}cur=-1}});
playEl.onclick=()=>{playing=!playing;playEl.textContent=playing?'일시정지':'재생';if(!playing)V.stop()};

function render(now){
  const cam=camAt(T),s=cv.width/W;
  ctx.setTransform(s,0,0,s,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);
  drawOutdoor(T,now);drawLab(T,now);drawPlume();drawStack(T,now);drawTruck(T,now);drawTrain(T,now);drawWorker(T,now);drawPacking(T);
  ctx.restore();
  drawReport(T,now);
  const sc=sceneAt(T);setCaption(sc);
  bars.forEach((b,i)=>{const end=i<SCN.length-1?SCN[i+1].t:LOOP;b.style.width=(i<sc?100:i>sc?0:clamp((T-SCN[i].t)/(end-SCN[i].t))*100)+'%'});
  clockEl.textContent=`00:${String(Math.floor(T)).padStart(2,'0')} / 00:30`;
}
window.CINE_seek=t=>{T=t;playing=false;playEl.textContent='재생';render(performance.now()/1000);return cv.toDataURL('image/jpeg',.8)};
function frame(){
  const now=performance.now()/1000,dt=Math.min(.05,now-last);last=now;
  if(playing){T+=dt;if(T>=LOOP)T-=LOOP;stepPlume(dt);stepFlow(dt,T>=6.5&&T<12.3);}
  render(T);requestAnimationFrame(frame);
}
render(last);requestAnimationFrame(frame);
})();
</script>
