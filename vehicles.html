1>자동차 배출가스 저감</h1></div><img src="assets/mamo-logo.png" alt="수도권대기환경청"></header><figure class="stage"><canvas id="cv" role="img" aria-label="자동차관리과의 주요 업무 5개 장면. 아래 자막과 장면 버튼으로 내용을 확인할 수 있습니다."></canvas><figcaption class="caption"><b id="capStep"></b><p id="capText" aria-live="polite"></p></figcaption></figure><div class="controls"><button id="play">일시정지</button><button id="replay">처음부터</button><div id="steps" aria-label="장면 선택"></div></div><div class="note"><span id="clock">00:00 / 00:20</span><span>20초 반복 재생 · 대표 업무를 요약한 교육용 개념도</span><a href="index.html#vehicles">과별 업무 전체 보기 ↗</a></div></main><script>/* Shared 20-second illustrated department stories. */

 if(i===3){factory(125,278,1.05);box(585,223,457,328);text('시설 관리',620,269,28,A);['허가사항 이행','배출시설 상태','방지시설 운영'].forEach((s,n)=>{text(s,620,330+n*70,23);if(u>n*.65)check(948,317+n*70,ease(u-n*.65))});let z=200+(u%2)*150;line(z,230,z,540,A,2)}

function vehicleScene(i,u){const k=ease(u/2);line(42,525,1158,525,'#465b72',4);for(let n=0;n<13;n++){const x=(n*105-t*50)%1300;line(x,566,x+54,566,'#3b4d60',3)}

const buttons=names.map((n,i)=>{const b=document.createElement('button');b.className='step';b.innerHTML=`<small>${String(i*4).padStart(2,'0')}초</small><b>${n}</b><i></i>`;b.onclick=()=>{t=i*4+.05;render()};document.getElementById('steps').append(b);return b});
function render(){const i=Math.min(4,Math.floor(t/4)),u=t-i*4;const d=cv.width/1200;c.setTransform(d,0,0,d,0,0);base(i);vehicle?vehicleScene(i,u):emissionScene(i,u);if(cur!==i){cur=i;cap.textContent=captions[i];step.textContent=`0${i+1} ${names[i]}`;buttons.forEach((b,j)=>{if(j===i)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')})}buttons.forEach((b,j)=>b.querySelector('i').style.width=(j<i?100:j>i?0:u/4*100)+'%');clock.textContent=`00:${String(Math.floor(t)).padStart(2,'0')} / 00:20`}

new ResizeObserver(resize).observe(cv);play.textContent=playing?'일시정지':'재생';play.onclick=()=>{playing=!playing;play.textContent=playing?'일시정지':'재생';last=performance.now()};document.getElementById('replay').onclick=()=>{t=0;playing=true;play.textContent='일시정지';last=performance.now();render()};

})();
