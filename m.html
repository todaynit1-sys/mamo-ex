<style>
/* Phone-first 30-second film with readable controls and caption below it. */
:root{color-scheme:light;--bg:#f5f8f3;--panel:#fff;--line:#d3e0d8;--text:#243e3c;--muted:#536e68;--accent:#217569;--soft:#e0f1e8;
  --sans:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
body[data-dept=emissions]{--accent:#347543;--soft:#e4f3df}body[data-dept=stack]{--accent:#986027;--soft:#fff0d9}body[data-dept=vehicles]{--accent:#6855a3;--soft:#ece6fa}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.top b{font-size:15px;color:var(--muted)}
.top img{height:34px;width:auto;display:block}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.depts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dept{font:inherit;font-size:13px;letter-spacing:-.03em;font-weight:700;min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);cursor:pointer;padding:6px 4px;line-height:1.3}
.dept[aria-selected=true]{background:var(--soft);border-color:var(--accent);color:var(--text);box-shadow:0 3px 0 var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{font:inherit;font-size:15px;font-weight:600;flex:none;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.head{padding-block:18px 6px}
.head small{display:block;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.head h1{margin:4px 0 6px;font-size:26px;line-height:1.35;text-wrap:balance}
.head p{margin:0;color:var(--muted);font-size:16px}
.listen{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--accent)}
.btn svg{flex:none}
.scenes{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:14px}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 0 #dce6dd}
.scene.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.scene figure{margin:0;background:#07111a;aspect-ratio:5/3}
.scene img{display:block;width:100%;height:100%;object-fit:cover}
.scene .body{padding:14px 16px 16px;display:grid;gap:6px}
.scene .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.scene h2{margin:0;font-size:19px;line-height:1.4;display:flex;align-items:baseline;gap:8px}
.scene h2 span{font-size:13px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.scene p{margin:0;font-size:17px;line-height:1.75}
.say{font:inherit;font-size:14px;font-weight:700;flex:none;min-height:40px;min-width:76px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.say[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}
.more{margin-top:22px;display:grid;gap:10px}
.next{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.next small{display:block;font-size:13px;color:var(--muted)}
.next b{font-size:17px}
.note{margin-top:20px;font-size:13px;line-height:1.7;color:var(--muted)}
.note a{color:var(--accent)}
button:focus-visible,a:focus-visible{outline:3px solid #3267a2;outline-offset:3px}
@media (min-width:600px){.head h1{font-size:30px}.scenes{gap:18px}}
@media (prefers-reduced-motion:no-preference){.scene.now{transition:box-shadow .2s}}

.film{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 0 #dce6dd}
.filmhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;font-size:14px;line-height:1.5}.filmhead strong{min-width:0;overflow-wrap:anywhere}.filmhead a{flex:none;color:var(--accent);font-size:13px}
.film iframe{display:block;width:100%;height:710px;border:0;background:var(--bg)}
@media(max-width:480px){.wrap{padding-inline:12px}.bar{margin-inline:-12px;padding-inline:12px}.chips{margin-inline:-12px;padding-inline:12px}.top b{font-size:13px}.top img{height:30px}.head{padding-block:10px 4px}.head h1{font-size:23px}.head p{font-size:15px}}
</style>
</head>
<body data-dept="sift-ms">
<main class="wrap">
  <header class="top"><b>부서별 업무 안내 · 영상 보기</b><img src="assets/mamo-logo.png" width="192" height="60" alt="기후에너지환경부 수도권대기환경청"></header>
  <div class="bar">
    <div class="depts" role="tablist" aria-label="부서 선택" id="depts"></div>
    <div class="chips" role="group" aria-label="업무 선택" id="chips"></div>
  </div>
  <section class="head" aria-live="polite">
    <small id="deptName">기획과</small>
    <h1 id="title">업무 제목</h1>
    <p id="desc"></p>
  </section>
  <section class="film" aria-label="선택한 업무의 30초 영상">
    <div class="filmhead"><strong id="filmTitle">30초 영상</strong><a id="openVideo" href="sift-ms.html" target="_blank" rel="noopener">전체 화면으로 보기 ↗</a></div>
    <iframe id="film" src="sift-ms.html?embed=1&amp;v=23" title="기획과 30초 영상" loading="eager"></iframe>
  </section>
  <nav class="more" aria-label="다음 업무" id="more"></nav>
  <p class="note">그림 속 지도·사업장·농도·측정값은 이해를 돕기 위한 예시입니다. 음성은 AI 합성 음성입니다.<br><a id="source" href="https://mcee.go.kr/mamo/web/index.do?menuId=656" target="_blank" rel="noopener">선택한 업무의 공식 자료 ↗</a></p>
</main>
<script src="assets/catalog.js?v=23"></script>

<script>
(() => {
'use strict';
const {departments,topics}=window.MAMO_CATALOG;
const byTopic=Object.fromEntries(topics.map(t=>[t.id,t]));
const byDept=Object.fromEntries(departments.map(d=>[d.id,d]));
const order=departments.flatMap(d=>d.topics);
const $=id=>document.getElementById(id),frame=$('film');
let current='';
const plain=s=>String(s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
for(const d of departments){const b=document.createElement('button');b.className='dept';b.type='button';b.setAttribute('role','tab');b.dataset.dept=d.id;b.textContent=d.dept;b.onclick=()=>go(d.topics[0]);$('depts').append(b)}
function go(id){if(location.hash.slice(1)!==id)location.hash=id;else render()}
function render(){let id=location.hash.slice(1);if(id==='inventory')id='mobile-air';if(!byTopic[id])id=order[0];if(id===current)return;current=id;
 const t=byTopic[id],d=byDept[t.dept];document.body.dataset.dept=d.id;document.title=`${d.dept} · ${plain(t.title)} | 영상 보기`;
 document.querySelectorAll('.dept').forEach(b=>{const on=b.dataset.dept===d.id;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});
 $('chips').replaceChildren(...d.topics.map(tid=>{const b=document.createElement('button');b.className='chip';b.type='button';b.textContent=plain(byTopic[tid].title);b.setAttribute('aria-pressed',String(tid===id));b.onclick=()=>go(tid);return b}));
 $('deptName').textContent=d.dept;$('title').textContent=plain(t.title);$('desc').textContent=t.desc;$('source').href=t.source;
 $('filmTitle').textContent='30초 · '+plain(t.title);$('openVideo').href=t.file+'?v=23';frame.title=plain(t.title)+' 30초 영상';frame.src=t.file+'?embed=1&v=23';frame.style.height='710px';
 const nx=order[(order.indexOf(id)+1)%order.length],nt=byTopic[nx];$('more').replaceChildren();const a=document.createElement('a');a.className='next';a.href='#'+nx;a.innerHTML=`<small>다음 업무 · ${byDept[nt.dept].dept}</small><b></b>`;a.querySelector('b').textContent=plain(nt.title)+' →';$('more').append(a);
 window.scrollTo(0,0)
}
frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc)return;for(const name of ['compact-player.css','friendly-player.css','readability.css']){const link=doc.createElement('link');link.rel='stylesheet';link.href='assets/'+name+'?v=23';doc.head.append(link)}});
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='mamo-lesson-size')return;const h=Number(e.data.height);if(Number.isFinite(h)&&h>100&&h<6000)frame.style.height=Math.ceil(h)+'px'});
window.addEventListener('hashchange',render);render();
})();
</script></body></html>
